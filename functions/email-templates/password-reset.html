<!--
  THE DROP — Password reset email
  Sent via the sendPasswordReset callable (functions/src/auth.ts)
  Just restyled today to match the rest of the templates.

  Placeholders:
    {{accountType}}   -> "vendor" or "customer"
    {{email}}
    {{resetLink}}
-->
<div style="font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #000000; color: #ffffff; padding: 60px 20px; text-align: center;">
  <div style="max-width: 600px; margin: 0 auto;">
    <img src="https://copdrop.io/assets/landing/drop_logo.svg" alt="THE DROP" style="width: 80px; height: 80px; margin-bottom: 20px;" />
    <h1 style="font-size: 48px; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px; color: #ffffff;">Reset Request.</h1>
    <div style="width: 50px; height: 4px; background: linear-gradient(90deg, #A855F7, #EC4899, #F97316); margin: 0 auto 30px;"></div>

    <p style="font-size: 20px; color: #cccccc; line-height: 1.6; margin-bottom: 30px;">
      We received a request to reset the password for your <strong>{{accountType}}</strong> account associated with <strong>{{email}}</strong>.
    </p>

    <a href="{{resetLink}}" style="display: inline-block; background-color: #ffffff; color: #000000; padding: 18px 40px; border-radius: 50px; text-decoration: none; font-weight: 900; font-size: 16px;">
      Reset Password
    </a>

    <p style="margin-top: 40px; font-size: 13px; color: #666666;">
      If you didn't ask for this, you can ignore this email — your password will not be changed.
    </p>

    <p style="margin-top: 60px; font-size: 12px; color: #666666;">
      © 2026 THE DROP. • Accra, Ghana
    </p>
  </div>
</div>

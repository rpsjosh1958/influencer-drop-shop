<!--
  THE DROP — Vendor announcement/broadcast email
  Sent from the super-admin Communications page (apps/web, broadcast route).
  Just restyled today to match the rest of the templates.

  Placeholders:
    {{subject}}   {{message}}
-->
<div style="font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #000000; color: #ffffff; padding: 60px 20px; text-align: center;">
  <div style="max-width: 600px; margin: 0 auto;">
    <img src="https://copdrop.io/assets/landing/drop_logo.svg" alt="THE DROP" style="width: 80px; height: 80px; margin-bottom: 20px;" />
    <h1 style="font-size: 48px; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px; color: #ffffff;">Platform Update.</h1>
    <div style="width: 50px; height: 4px; background: linear-gradient(90deg, #A855F7, #EC4899, #F97316); margin: 0 auto 30px;"></div>

    <h2 style="font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 20px;">{{subject}}</h2>
    <p style="color: #cccccc; font-size: 16px; line-height: 1.6; white-space: pre-wrap; text-align: left;">{{message}}</p>
    <p style="margin-top: 40px; font-size: 12px; color: #666666;">
      You're receiving this as a registered vendor on The Drop.
    </p>

    <p style="margin-top: 60px; font-size: 12px; color: #666666;">
      © 2026 THE DROP. • Accra, Ghana
    </p>
  </div>
</div>

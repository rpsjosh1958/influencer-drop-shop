<!--
  THE DROP — Blank shell for one-off personalized emails.
  Same wrapper every other template uses (logo, gradient underline,
  black background, footer) — just swap the title and body content.

  {{title}}  -> short punchy phrase, e.g. "You're All Set." (not the
               literal subject line — this renders large/bold, so keep
               it to 2-4 words)
  {{body}}   -> your message, plain paragraphs or the callout/button
               blocks below
-->
<div style="font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #000000; color: #ffffff; padding: 60px 20px; text-align: center;">
  <div style="max-width: 600px; margin: 0 auto;">
    <img src="https://copdrop.io/assets/landing/drop_logo.svg" alt="THE DROP" style="width: 80px; height: 80px; margin-bottom: 20px;" />
    <h1 style="font-size: 48px; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px; color: #ffffff;">{{title}}</h1>
    <div style="width: 50px; height: 4px; background: linear-gradient(90deg, #A855F7, #EC4899, #F97316); margin: 0 auto 30px;"></div>

    <p style="font-size: 20px; color: #cccccc; line-height: 1.6; margin-bottom: 30px; text-align: left;">
      {{body}}
    </p>

    <!-- Optional callout box — delete if not needed
    <div style="background: rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; margin-bottom: 40px; text-align: left; border: 1px solid #333;">
      <h3 style="margin-top: 0; margin-bottom: 15px; color: #ffffff;">Heading</h3>
      <p style="color: #ccc; margin: 0;">Details go here.</p>
    </div>
    -->

    <!-- Optional button — delete if not needed
    <a href="https://copdrop.io/admin" style="display: inline-block; background-color: #ffffff; color: #000000; padding: 18px 40px; border-radius: 50px; text-decoration: none; font-weight: 900; font-size: 16px;">
      Button Label
    </a>
    -->

    <p style="margin-top: 60px; font-size: 12px; color: #666666;">
      © 2026 THE DROP. • Accra, Ghana
    </p>
  </div>
</div>
